<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detail Tugas</title>


<link rel="stylesheet" href="style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>



<body>



<div class="sidebar">


<div class="logo">

<i class="fa-solid fa-clipboard-check"></i>

<span>To Do List</span>

</div>





<ul class="menu">


<li>

<a href="index.html">

<i class="fa-solid fa-house"></i>

Home

</a>

</li>





<li>

<a href="tasks.html">

<i class="fa-regular fa-clipboard"></i>

Daftar Tugas

</a>

</li>





<li>

<a href="add-task.html">

<i class="fa-solid fa-circle-plus"></i>

Tambah Tugas

</a>

</li>





<li class="active">

<a href="detail.html">

<i class="fa-solid fa-circle-info"></i>

Detail Tugas

</a>

</li>




</ul>



</div>







<div class="content">


<div class="card">



<h1 style="margin-bottom:25px;">

Detail Tugas

</h1>





<div class="form-group">

<label>

Mata Pelajaran

</label>


<input 
type="text"
id="detailSubject"
readonly>


</div>







<div class="form-group">


<label>

Keterangan Tugas

</label>



<textarea 
id="detailDescription"
readonly></textarea>


</div>







<div class="form-group">


<label>

Deadline

</label>



<input
type="text"
id="detailDeadline"
readonly>



</div>







<div class="form-group">


<label>

Status

</label>



<input
type="text"
id="detailStatus"
readonly>



</div>







<a href="tasks.html" class="btn">

Kembali

</a>



<button 
onclick="editCurrentTask()"
class="btn edit">

Edit Tugas

</button>




</div>


</div>







<script>



const tasks =
JSON.parse(localStorage.getItem("tasks")) || [];



const selectedId =
localStorage.getItem("selectedTask");



const task =
tasks.find(
item=>item.id == selectedId
);





if(task){



document.getElementById("detailSubject").value =
task.subject;



document.getElementById("detailDescription").value =
task.description;



document.getElementById("detailDeadline").value =
task.deadline;



document.getElementById("detailStatus").value =
task.status;



}







function editCurrentTask(){



localStorage.setItem(

"editTask",

selectedId

);



window.location.href="add-task.html";



}



</script>





</body>

</html>
