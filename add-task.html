<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Tugas</title>


<link rel="stylesheet" href="style.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>


<body>


<div class="sidebar">


<div class="logo">

<i class="fa-solid fa-clipboard-check"></i>

<span>To Do List</span>

</div>



<ul class="menu">


<li>

<a href="index.html">

<i class="fa-solid fa-house"></i>

Home

</a>

</li>



<li>

<a href="tasks.html">

<i class="fa-regular fa-clipboard"></i>

Daftar Tugas

</a>

</li>



<li class="active">

<a href="add-task.html">

<i class="fa-solid fa-circle-plus"></i>

Tambah Tugas

</a>

</li>



<li>

<a href="detail.html">

<i class="fa-solid fa-circle-info"></i>

Detail Tugas

</a>

</li>


</ul>


</div>




<div class="content">


<div class="card">


<h1 style="margin-bottom:25px;">

Tambah Tugas

</h1>



<form id="taskForm">



<div class="form-group">

<label>
Mata Pelajaran
</label>


<input 
type="text"
id="subject"
required>

</div>





<div class="form-group">

<label>
Keterangan Tugas
</label>


<textarea
id="description"
required></textarea>


</div>





<div class="form-group">

<label>
Deadline
</label>


<input 
type="date"
id="deadline"
required>


</div>





<div class="form-group">


<label>
Status Tugas
</label>


<select id="status">


<option value="Belum Selesai">

Belum Selesai

</option>


<option value="Selesai">

Selesai

</option>


</select>


</div>






<button type="submit" class="btn">

Simpan Tugas

</button>




</form>



</div>


</div>




<script src="script.js"></script>


</body>


</html>
